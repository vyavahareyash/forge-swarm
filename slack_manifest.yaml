display_information:
  name: Antigravity Dev Team
  description: Autonomous Issue-Triggered SWE, QA & Orchestrator Agents
  background_color: "#111827"
features:
  bot_user:
    display_name: Antigravity Orchestrator
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - chat:write.customize
      - commands
      - groups:history
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
